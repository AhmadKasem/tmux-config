# BEGIN tmux-overview (managed)
set -g @resurrect-dir "$HOME/.local/state/tmux-overview/snapshots"
set -g @resurrect-processes 'false'
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-never-overwrite 'on'
set -g @resurrect-save ''
set -g @resurrect-restore ''
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @resurrect-hook-post-save-layout "$HOME/projects/tmux-overview/bin/overview pair"
bind-key G run-shell "$HOME/projects/tmux-overview/bin/overview open --client '#{client_name}'"
run-shell "$HOME/projects/tmux-overview/bin/overview configure-status"
run-shell "$HOME/projects/tmux-overview/vendor/tmux-resurrect/resurrect.tmux"
set -g @resurrect-save-script-path "$HOME/projects/tmux-overview/bin/overview-save"
set -g @resurrect-restore-script-path "$HOME/projects/tmux-overview/bin/overview-restore"
run-shell -b "$HOME/projects/tmux-overview/vendor/tmux-continuum/continuum.tmux"
run-shell -b "$HOME/projects/tmux-overview/bin/overview-bootstrap"
# END tmux-overview (managed)
