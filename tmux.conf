# True color for Konsole over SSH (TERM=xterm-256color).
set -s terminal-features[3] "xterm-256color:RGB"

set -g set-clipboard on
bind -T copy-mode-vi Enter send-keys -X copy-pipe "base64 | tr -d '\n' | xargs -I{} printf '\033]52;c;{}\a'"
bind -T copy-mode-vi y send-keys -X copy-pipe "base64 | tr -d '\n' | xargs -I{} printf '\033]52;c;{}\a'"
set -g mode-keys vi
# Keep mouse selection from implicitly copying and exiting copy-mode; use y or Enter to copy.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection

# Deep Sea is the default; change it with tmux-theme.
source-file "$HOME/.config/tmux/themes/current.conf"

# Optional project overview and layout recovery, installed separately.
if-shell 'test -x "$HOME/projects/tmux-overview/bin/overview"' 'source-file "$HOME/.config/tmux/overview.conf"'
