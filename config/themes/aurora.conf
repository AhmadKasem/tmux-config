# Aurora — smoky aubergine panels, soft mint and lavender accents.
set -g mouse on
set -g focus-events on
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#211C2D,fg=#BEB4CD"
set -g status-left-length 25
set -g status-right-length 58
set -g status-left "#[fg=#A8DDCC,bold] ▰ #{?#{e|<:#{client_width},80},#{=6:session_name},#{=12:session_name}} #[fg=#675773,nobold]│#[default]#{?client_prefix,#[fg=#C5B4E3] CMD , }"
set -g status-right "#{?#{e|>=:#{client_width},100},#[fg=#675773]│ #[fg=#C5B4E3]◷ #[fg=#A8DDCC]%H:%M #[fg=#675773]// #[fg=#A99AB8]%d.%m ,}"

set -g window-status-separator " "
set -g window-status-format "#[fg=#675773,bg=#211C2D]⟨#[fg=#A99AB8] #I #[fg=#DBD2E5]#{?#{e|<:#{client_width},80},#{=8:window_name},#{=18:window_name}} #{?window_activity_flag,#[fg=#A8DDCC]· ,}#[fg=#675773]⟩"
set -g window-status-current-format "#[fg=#A8DDCC,bg=#211C2D]▐#[fg=#A8DDCC,bg=#453852,bold] #I #[fg=#F0EAF5]#{?#{e|<:#{client_width},80},#{=8:window_name},#{=18:window_name}} #{?window_zoomed_flag,#[fg=#C5B4E3]↗ ,}#[fg=#A8DDCC,bg=#211C2D,nobold]▌"
set -g window-status-activity-style "fg=#A8DDCC,bg=#211C2D,bold"
set -g window-status-bell-style "fg=#C5B4E3,bg=#211C2D,bold"

set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-style "fg=#493B57"
set -g pane-active-border-style "fg=#A8DDCC"
set -g pane-border-format "#{?pane_active,#[fg=#A8DDCC],#[fg=#91809F]} ┤ #{pane_index} #[fg=#C5B4E3]#{?#{e|<:#{pane_width},80},#{=10:pane_current_command},#{=14:pane_current_command}}#{?#{e|>=:#{pane_width},80}, #[fg=#675773]// #[fg=#A99AB8]#{=24:#{b:pane_current_path}},} #{?pane_active,#[fg=#A8DDCC],#[fg=#91809F]}├ "
set -g window-style "bg=#292236"
set -g window-active-style "bg=#31283F"
set -g display-panes-colour "#C5B4E3"
set -g display-panes-active-colour "#A8DDCC"

set -g message-style "bg=#453852,fg=#A8DDCC,bold"
set -g message-command-style "bg=#453852,fg=#C5B4E3"
set -g mode-style "bg=#57466B,fg=#F0EAF5,bold"
set -g clock-mode-colour "#A8DDCC"
set -g copy-mode-match-style "bg=#C5B4E3,fg=#211C2D"
set -g copy-mode-current-match-style "bg=#A8DDCC,fg=#211C2D,bold"
