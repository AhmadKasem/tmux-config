# Storm — blue-grey panels, silver text and restrained cyan accents.
set -g mouse on
set -g focus-events on
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1B2530,fg=#B9C4D0"
set -g status-left-length 25
set -g status-right-length 58
set -g status-left "#[fg=#8FCBD5,bold] ▰ #{?#{e|<:#{client_width},80},#{=6:session_name},#{=12:session_name}} #[fg=#596C80,nobold]│#[default]#{?client_prefix,#[fg=#C3CBD6] CMD , }"
set -g status-right "#{?#{e|>=:#{client_width},100},#[fg=#596C80]│ #[fg=#C3CBD6]◷ #[fg=#8FCBD5]%H:%M #[fg=#596C80]// #[fg=#9BAEBF]%d.%m ,}"

set -g window-status-separator " "
set -g window-status-format "#[fg=#596C80,bg=#1B2530]⟨#[fg=#9BAEBF] #I #[fg=#D5DFE8]#{?#{e|<:#{client_width},80},#{=8:window_name},#{=18:window_name}} #{?window_activity_flag,#[fg=#8FCBD5]· ,}#[fg=#596C80]⟩"
set -g window-status-current-format "#[fg=#8FCBD5,bg=#1B2530]▐#[fg=#8FCBD5,bg=#3A4C60,bold] #I #[fg=#EDF2F7]#{?#{e|<:#{client_width},80},#{=8:window_name},#{=18:window_name}} #{?window_zoomed_flag,#[fg=#C3CBD6]↗ ,}#[fg=#8FCBD5,bg=#1B2530,nobold]▌"
set -g window-status-activity-style "fg=#8FCBD5,bg=#1B2530,bold"
set -g window-status-bell-style "fg=#C3CBD6,bg=#1B2530,bold"

set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-style "fg=#3F5266"
set -g pane-active-border-style "fg=#8FCBD5"
set -g pane-border-format "#{?pane_active,#[fg=#8FCBD5],#[fg=#8096AB]} ┤ #{pane_index} #[fg=#C3CBD6]#{?#{e|<:#{pane_width},80},#{=10:pane_current_command},#{=14:pane_current_command}}#{?#{e|>=:#{pane_width},80}, #[fg=#596C80]// #[fg=#9BAEBF]#{=24:#{b:pane_current_path}},} #{?pane_active,#[fg=#8FCBD5],#[fg=#8096AB]}├ "
set -g window-style "bg=#202C3A"
set -g window-active-style "bg=#293747"
set -g display-panes-colour "#C3CBD6"
set -g display-panes-active-colour "#8FCBD5"

set -g message-style "bg=#3A4C60,fg=#8FCBD5,bold"
set -g message-command-style "bg=#3A4C60,fg=#C3CBD6"
set -g mode-style "bg=#4A6176,fg=#EDF2F7,bold"
set -g clock-mode-colour "#8FCBD5"
set -g copy-mode-match-style "bg=#C3CBD6,fg=#1B2530"
set -g copy-mode-current-match-style "bg=#8FCBD5,fg=#1B2530,bold"
