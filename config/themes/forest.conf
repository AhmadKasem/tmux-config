# Forest — deep evergreen panels, sage highlights and copper accents.
set -g mouse on
set -g focus-events on
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#17261F,fg=#BBC7B6"
set -g status-left-length 25
set -g status-right-length 58
set -g status-left "#[fg=#B0C99A,bold] ▰ #{?#{e|<:#{client_width},80},#{=6:session_name},#{=12:session_name}} #[fg=#586D58,nobold]│#[default]#{?client_prefix,#[fg=#D59A73] CMD , }"
set -g status-right "#{?#{e|>=:#{client_width},100},#[fg=#586D58]│ #[fg=#D59A73]◷ #[fg=#B0C99A]%H:%M #[fg=#586D58]// #[fg=#9BAC94]%d.%m ,}"

set -g window-status-separator " "
set -g window-status-format "#[fg=#586D58,bg=#17261F]⟨#[fg=#9BAC94] #I #[fg=#D6DFCE]#{?#{e|<:#{client_width},80},#{=8:window_name},#{=18:window_name}} #{?window_activity_flag,#[fg=#B0C99A]· ,}#[fg=#586D58]⟩"
set -g window-status-current-format "#[fg=#B0C99A,bg=#17261F]▐#[fg=#B0C99A,bg=#354E3C,bold] #I #[fg=#EDF1E5]#{?#{e|<:#{client_width},80},#{=8:window_name},#{=18:window_name}} #{?window_zoomed_flag,#[fg=#D59A73]↗ ,}#[fg=#B0C99A,bg=#17261F,nobold]▌"
set -g window-status-activity-style "fg=#B0C99A,bg=#17261F,bold"
set -g window-status-bell-style "fg=#D59A73,bg=#17261F,bold"

set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-style "fg=#3C5540"
set -g pane-active-border-style "fg=#B0C99A"
set -g pane-border-format "#{?pane_active,#[fg=#B0C99A],#[fg=#809577]} ┤ #{pane_index} #[fg=#D59A73]#{?#{e|<:#{pane_width},80},#{=10:pane_current_command},#{=14:pane_current_command}}#{?#{e|>=:#{pane_width},80}, #[fg=#586D58]// #[fg=#9BAC94]#{=24:#{b:pane_current_path}},} #{?pane_active,#[fg=#B0C99A],#[fg=#809577]}├ "
set -g window-style "bg=#1D3026"
set -g window-active-style "bg=#243B2F"
set -g display-panes-colour "#D59A73"
set -g display-panes-active-colour "#B0C99A"

set -g message-style "bg=#354E3C,fg=#B0C99A,bold"
set -g message-command-style "bg=#354E3C,fg=#D59A73"
set -g mode-style "bg=#496547,fg=#EDF1E5,bold"
set -g clock-mode-colour "#B0C99A"
set -g copy-mode-match-style "bg=#D59A73,fg=#17261F"
set -g copy-mode-current-match-style "bg=#B0C99A,fg=#17261F,bold"
