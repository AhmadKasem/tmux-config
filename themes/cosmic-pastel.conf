# Cosmic pastel tmux theme. Uses standard terminal glyphs; no icon font required.
set -g mouse on
set -g focus-events on
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#191724,fg=#e0def4"
set -g status-left-length 24
set -g status-right-length 58
set -g status-left "#[fg=#191724,bg=#c4a7e7,bold] ✦ #{=12:session_name} #[default]#{?client_prefix,#[fg=#f6c177] PREFIX , }"
set -g status-right "#{?#{>=:#{client_width},100},#[fg=#6e6a86] · #[fg=#ebbcba]%a %d #[fg=#9ccfd8]%H:%M ,}"

set -g window-status-separator " "
set -g window-status-format "#[fg=#908caa,bg=#232136] #I #[fg=#e0def4]#{=18:window_name} #{?window_zoomed_flag,↗ ,}"
set -g window-status-current-format "#[fg=#191724,bg=#ebbcba,bold] ● #I #{=18:window_name} #{?window_zoomed_flag,↗ ,}"
set -g window-status-activity-style "fg=#9ccfd8,bg=#232136,bold"
set -g window-status-bell-style "fg=#f6c177,bg=#232136,bold"

set -g pane-border-style "fg=#393552"
set -g pane-active-border-style "fg=#9ccfd8"
set -g display-panes-colour "#c4a7e7"
set -g display-panes-active-colour "#f6c177"

set -g message-style "bg=#c4a7e7,fg=#191724,bold"
set -g message-command-style "bg=#232136,fg=#9ccfd8"
set -g mode-style "bg=#c4a7e7,fg=#191724,bold"
set -g clock-mode-colour "#ebbcba"
set -g copy-mode-match-style "bg=#f6c177,fg=#191724"
set -g copy-mode-current-match-style "bg=#9ccfd8,fg=#191724,bold"

# Restore settings introduced by other saved themes.
set -g pane-border-lines "single"
set -g pane-border-status "off"
set -g pane-border-format "#{?pane_active,#[reverse],}#{pane_index}#[default] \"#{pane_title}\""
set -g window-style "default"
set -g window-active-style "default"
