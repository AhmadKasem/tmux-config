# Deep Sea — petrol panels, mint highlights and soft coral accents.
set -g mouse on
set -g focus-events on
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0B2628,fg=#A4C4C1"
set -g status-left-length 25
set -g status-right-length 58
set -g status-left "#[fg=#5EEAD4,bold] ▰ #{=12:session_name} #[fg=#416C6E,nobold]│#[default]#{?client_prefix,#[fg=#F89B91] CMD , }"
set -g status-right "#{?#{>=:#{client_width},100},#[fg=#416C6E]│ #[fg=#F89B91]◷ #[fg=#5EEAD4]%H:%M #[fg=#416C6E]// #[fg=#8EB5B2]%d.%m ,}"

set -g window-status-separator " "
set -g window-status-format "#[fg=#416C6E,bg=#0B2628]⟨#[fg=#8EB5B2] #I #[fg=#C6DFDA]#{=18:window_name} #{?window_activity_flag,#[fg=#5EEAD4]· ,}#[fg=#416C6E]⟩"
set -g window-status-current-format "#[fg=#5EEAD4,bg=#0B2628]▐#[fg=#5EEAD4,bg=#225256,bold] #I #[fg=#E5F5F1]#{=18:window_name} #{?window_zoomed_flag,#[fg=#F89B91]↗ ,}#[fg=#5EEAD4,bg=#0B2628,nobold]▌"
set -g window-status-activity-style "fg=#5EEAD4,bg=#0B2628,bold"
set -g window-status-bell-style "fg=#F89B91,bg=#0B2628,bold"

set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-style "fg=#2B575A"
set -g pane-active-border-style "fg=#5EEAD4"
set -g pane-border-format "#{?pane_active,#[fg=#5EEAD4],#[fg=#6A9998]} ┤ #{pane_index} #[fg=#F89B91]#{=14:pane_current_command} #[fg=#416C6E]// #[fg=#8EB5B2]#{=24:#{b:pane_current_path}} #{?pane_active,#[fg=#5EEAD4],#[fg=#6A9998]}├ "
set -g window-style "bg=#103236"
set -g window-active-style "bg=#153E41"
set -g display-panes-colour "#F89B91"
set -g display-panes-active-colour "#5EEAD4"

set -g message-style "bg=#225256,fg=#5EEAD4,bold"
set -g message-command-style "bg=#225256,fg=#F89B91"
set -g mode-style "bg=#286367,fg=#E5F5F1,bold"
set -g clock-mode-colour "#5EEAD4"
set -g copy-mode-match-style "bg=#F89B91,fg=#0B2628"
set -g copy-mode-current-match-style "bg=#5EEAD4,fg=#0B2628,bold"
