# Moonlight — muted indigo, icy blue tabs and pale lavender borders.
set -g mouse on
set -g focus-events on
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#191E35,fg=#BAC3E0"
set -g status-left-length 25
set -g status-right-length 58
set -g status-left "#[fg=#9DDCFF,bold] ▰ #{=12:session_name} #[fg=#52618C,nobold]│#[default]#{?client_prefix,#[fg=#C4B5FD] CMD , }"
set -g status-right "#{?#{>=:#{client_width},100},#[fg=#52618C]│ #[fg=#C4B5FD]◷ #[fg=#9DDCFF]%H:%M #[fg=#52618C]// #[fg=#9DAACD]%d.%m ,}"

set -g window-status-separator " "
set -g window-status-format "#[fg=#52618C,bg=#191E35]⟨#[fg=#9DAACD] #I #[fg=#D5DEF5]#{=18:window_name} #{?window_activity_flag,#[fg=#9DDCFF]· ,}#[fg=#52618C]⟩"
set -g window-status-current-format "#[fg=#9DDCFF,bg=#191E35]▐#[fg=#9DDCFF,bg=#35446B,bold] #I #[fg=#F0F4FF]#{=18:window_name} #{?window_zoomed_flag,#[fg=#C4B5FD]↗ ,}#[fg=#9DDCFF,bg=#191E35,nobold]▌"
set -g window-status-activity-style "fg=#9DDCFF,bg=#191E35,bold"
set -g window-status-bell-style "fg=#C4B5FD,bg=#191E35,bold"

set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-style "fg=#424B70"
set -g pane-active-border-style "fg=#C4B5FD"
set -g pane-border-format "#{?pane_active,#[fg=#C4B5FD],#[fg=#8490B7]} ┤ #{pane_index} #[fg=#C4B5FD]#{=14:pane_current_command} #[fg=#52618C]// #[fg=#9DAACD]#{=24:#{b:pane_current_path}} #{?pane_active,#[fg=#C4B5FD],#[fg=#8490B7]}├ "
set -g window-style "bg=#1E2440"
set -g window-active-style "bg=#252D4D"
set -g display-panes-colour "#C4B5FD"
set -g display-panes-active-colour "#9DDCFF"

set -g message-style "bg=#35446B,fg=#9DDCFF,bold"
set -g message-command-style "bg=#35446B,fg=#C4B5FD"
set -g mode-style "bg=#495788,fg=#F0F4FF,bold"
set -g clock-mode-colour "#9DDCFF"
set -g copy-mode-match-style "bg=#C4B5FD,fg=#191E35"
set -g copy-mode-current-match-style "bg=#9DDCFF,fg=#191E35,bold"
