# Glacier — cool light panels, navy text and teal accents.
set -g mouse on
set -g focus-events on
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#E3EEF2,fg=#314B61"
set -g status-left-length 25
set -g status-right-length 58
set -g status-left "#[fg=#007F85,bold] ▰ #{=12:session_name} #[fg=#71899A,nobold]│#[default]#{?client_prefix,#[fg=#6554A6] CMD , }"
set -g status-right "#{?#{>=:#{client_width},100},#[fg=#71899A]│ #[fg=#6554A6]◷ #[fg=#007F85]%H:%M #[fg=#71899A]// #[fg=#526D82]%d.%m ,}"

set -g window-status-separator " "
set -g window-status-format "#[fg=#71899A,bg=#E3EEF2]⟨#[fg=#526D82] #I #[fg=#304C62]#{=18:window_name} #{?window_activity_flag,#[fg=#007F85]· ,}#[fg=#71899A]⟩"
set -g window-status-current-format "#[fg=#007F85,bg=#E3EEF2]▐#[fg=#007F85,bg=#C8E3E8,bold] #I #[fg=#20334B]#{=18:window_name} #{?window_zoomed_flag,#[fg=#6554A6]↗ ,}#[fg=#007F85,bg=#E3EEF2,nobold]▌"
set -g window-status-activity-style "fg=#007F85,bg=#E3EEF2,bold"
set -g window-status-bell-style "fg=#6554A6,bg=#E3EEF2,bold"

set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-style "fg=#A6BEC9"
set -g pane-active-border-style "fg=#007F85"
set -g pane-border-format "#{?pane_active,#[fg=#6554A6],#[fg=#637D90]} ┤ #{pane_index} #[fg=#6554A6]#{=14:pane_current_command} #[fg=#71899A]// #[fg=#526D82]#{=24:#{b:pane_current_path}} #{?pane_active,#[fg=#6554A6],#[fg=#637D90]}├ "
set -g window-style "fg=#20334B,bg=#ECF3F7"
set -g window-active-style "fg=#20334B,bg=#F4F8FB"
set -g display-panes-colour "#6554A6"
set -g display-panes-active-colour "#007F85"

set -g message-style "bg=#C8E3E8,fg=#007F85,bold"
set -g message-command-style "bg=#C8E3E8,fg=#6554A6"
set -g mode-style "bg=#B9D9E5,fg=#20334B,bold"
set -g clock-mode-colour "#007F85"
set -g copy-mode-match-style "bg=#6554A6,fg=#E3EEF2"
set -g copy-mode-current-match-style "bg=#007F85,fg=#E3EEF2,bold"
