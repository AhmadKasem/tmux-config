# Warm Espresso — the Neon Grid layout with brown panels.
set -g mouse on
set -g focus-events on
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#392820,fg=#8DA8C8"
set -g status-left-length 25
set -g status-right-length 58
set -g status-left "#[fg=#36F9F6,bold] ▰ #{=12:session_name} #[fg=#354B70,nobold]│#[default]#{?client_prefix,#[fg=#FF5CBA] CMD , }"
set -g status-right "#{?#{>=:#{client_width},100},#[fg=#354B70]│ #[fg=#8B7CFF]◷ #[fg=#36F9F6]%H:%M #[fg=#354B70]// #[fg=#7591B2]%d.%m ,}"

set -g window-status-separator " "
set -g window-status-format "#[fg=#354B70,bg=#392820]⟨#[fg=#7591B2] #I #[fg=#A6B9D3]#{=18:window_name} #{?window_activity_flag,#[fg=#36F9F6]· ,}#[fg=#354B70]⟩"
set -g window-status-current-format "#[fg=#36F9F6,bg=#392820]▐#[fg=#36F9F6,bg=#604337,bold] #I #[fg=#F1F7FF]#{=18:window_name} #{?window_zoomed_flag,#[fg=#FF5CBA]↗ ,}#[fg=#36F9F6,bg=#392820,nobold]▌"
set -g window-status-activity-style "fg=#36F9F6,bg=#392820,bold"
set -g window-status-bell-style "fg=#FF5CBA,bg=#392820,bold"

set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-style "fg=#253554"
set -g pane-active-border-style "fg=#36F9F6"
set -g pane-border-format "#{?pane_active,#[fg=#36F9F6],#[fg=#526B90]} ┤ #{pane_index} #[fg=#8B7CFF]#{=14:pane_current_command} #[fg=#354B70]// #[fg=#7591B2]#{=24:#{b:pane_current_path}} #{?pane_active,#[fg=#36F9F6],#[fg=#526B90]}├ "
set -g window-style "bg=#422E27"
set -g window-active-style "bg=#4C352B"
set -g display-panes-colour "#8B7CFF"
set -g display-panes-active-colour "#36F9F6"

set -g message-style "bg=#604337,fg=#36F9F6,bold"
set -g message-command-style "bg=#604337,fg=#FF5CBA"
set -g mode-style "bg=#283663,fg=#F1F7FF,bold"
set -g clock-mode-colour "#36F9F6"
set -g copy-mode-match-style "bg=#8B7CFF,fg=#392820"
set -g copy-mode-current-match-style "bg=#36F9F6,fg=#392820,bold"
